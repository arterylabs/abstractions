server {
    listen 80;
    listen [::]:80;
    server_name useabstractions.com www.useabstractions.com;

    # Allow Let's Encrypt ACME challenges for certificate renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://useabstractions.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2 ipv6only=on;
    server_name useabstractions.com www.useabstractions.com;

    ssl_certificate /etc/letsencrypt/live/useabstractions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/useabstractions.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # PostHog reverse proxy at /p/* (SDK api_host: /p).
    # Matches https://posthog.com/docs/advanced/proxy/nginx — three location
    # blocks (static, array, catch-all) with trailing-slash proxy_pass so nginx
    # replaces the matched prefix. proxy_ssl_server_name + proxy_ssl_name are
    # required for SNI to PostHog's virtual hosts.
    location /p/static/ {
        proxy_pass https://us-assets.i.posthog.com/static/;
        proxy_set_header Host us-assets.i.posthog.com;
        proxy_ssl_server_name on;
        proxy_ssl_name us-assets.i.posthog.com;
    }

    location /p/array/ {
        proxy_pass https://us-assets.i.posthog.com/array/;
        proxy_set_header Host us-assets.i.posthog.com;
        proxy_ssl_server_name on;
        proxy_ssl_name us-assets.i.posthog.com;
    }

    location /p/ {
        proxy_pass https://us.i.posthog.com/;
        proxy_set_header Host us.i.posthog.com;
        proxy_ssl_server_name on;
        proxy_ssl_name us.i.posthog.com;
    }

    # Strip /api prefix and proxy to Go backend
    location /api/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:1234;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Proxy all other requests to Next.js frontend
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}