# Cache zone for the proxied Plausible script (used by `proxy_cache jscache;` below)
proxy_cache_path /var/cache/nginx/jscache levels=1:2 keys_zone=jscache:10m max_size=1g inactive=60m use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name useabstractions.com www.useabstractions.com;

    # Allow Let's Encrypt ACME challenges for certificate renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://useabstractions.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2 ipv6only=on;
    server_name useabstractions.com www.useabstractions.com;

    ssl_certificate /etc/letsencrypt/live/useabstractions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/useabstractions.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Using a variable in proxy_pass defers upstream DNS resolution to request
    # time, which requires an explicit resolver. Without it, plausible.io cannot
    # be resolved and the proxy returns 502.
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    set $plausible_script_url https://plausible.io/js/pa-SM58bMnBa3Kk8bb0jkiLS.js;
    set $plausible_event_url https://plausible.io/api/event;

    # Plausible script, proxied at /p/script.js
    location = /p/script.js {
        proxy_pass $plausible_script_url;
        proxy_set_header Host plausible.io;
        proxy_buffering on;

        # Remove these three lines if you skipped step 1 (no caching)
        proxy_cache jscache;
        proxy_cache_valid 200 5m;
        proxy_cache_use_stale updating error timeout invalid_header http_500;

        add_header X-Cache $upstream_cache_status;
    }

    # Plausible event collection, proxied at /p/event
    location = /p/event {
        proxy_pass $plausible_event_url;
        proxy_set_header Host plausible.io;
        proxy_buffering on;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Strip /api prefix and proxy to Go backend
    location /api/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:1234;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Proxy all other requests to Next.js frontend
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}