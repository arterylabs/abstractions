name: Build and Deploy

on:
  workflow_run:
    workflows:
      - "Tests"
    branches:
      - "main"
    types:
      - completed

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-api:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/abstractions-api:latest
            ghcr.io/${{ github.repository_owner }}/abstractions-api:${{ github.sha }}

  build-workers:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push workers image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/workers/Dockerfile
          push: true
          cache-from: type=gha,scope=workers
          cache-to: type=gha,scope=workers,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/abstractions-workers:latest
            ghcr.io/${{ github.repository_owner }}/abstractions-workers:${{ github.sha }}

  build-frontend:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_ENABLE_ANALYTICS=true
          tags: |
            ghcr.io/${{ github.repository_owner }}/abstractions-frontend:latest
            ghcr.io/${{ github.repository_owner }}/abstractions-frontend:${{ github.sha }}

  deploy:
    needs: [build-api, build-workers, build-frontend]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://useabstractions.com
    env:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
      REPO_OWNER: ${{ github.repository_owner }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docker-compose.yml
            conf
          sparse-checkout-cone-mode: false

      - name: Copy config files to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.yml,conf/useabstractions.com.conf"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_TOKEN,GITHUB_ACTOR,REPO_OWNER,IMAGE_TAG
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            sudo cp conf/useabstractions.com.conf /etc/nginx/sites-available/useabstractions.com
            sudo ln -sf /etc/nginx/sites-available/useabstractions.com /etc/nginx/sites-enabled/useabstractions.com
            sudo nginx -t
            sudo systemctl reload nginx

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            export API_TAG="$IMAGE_TAG"
            export WORKERS_TAG="$IMAGE_TAG"
            export FRONTEND_TAG="$IMAGE_TAG"

            docker compose pull

            docker compose run --rm --no-deps api /api migrate 0

            docker compose up -d --remove-orphans --wait --wait-timeout 120

            docker image prune -f --filter "until=24h"
