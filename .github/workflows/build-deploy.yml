name: Build and Deploy

on:
  push:
    branches:
      - "master"

jobs:
  build-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/abstractions-api:latest
            ghcr.io/${{ github.repository_owner }}/abstractions-api:${{ github.event.workflow_run.head_sha }}

  build-workers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push workers image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/workers/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/abstractions-workers:latest
            ghcr.io/${{ github.repository_owner }}/abstractions-workers:${{ github.event.workflow_run.head_sha }}

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/abstractions-frontend:latest
            ghcr.io/${{ github.repository_owner }}/abstractions-frontend:${{ github.event.workflow_run.head_sha }}

  deploy:
    needs: [ build-api, build-workers, build-frontend ]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    env:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
      REPO_OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: docker-compose.yml
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Copy nginx config to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: conf/useabstractions.com.conf
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_TOKEN,GITHUB_ACTOR,REPO_OWNER
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            sudo cp conf/useabstractions.com.conf /etc/nginx/sites-available/useabstractions.com
            sudo ln -sf /etc/nginx/sites-available/useabstractions.com /etc/nginx/sites-enabled/useabstractions.com
            sudo nginx -t
            sudo systemctl reload nginx

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            docker compose pull

            docker compose run --rm --no-deps api /api migrate 0

            docker compose up -d --remove-orphans

            docker image prune -f
